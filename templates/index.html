<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Roleplay Interface</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-info">
                <h1>AI Roleplay</h1>
                <span id="status-indicator">Connecting...</span>
            </div>
            <div>
                <button id="voice-toggle-btn">🔊 Voice: On</button>
                <button id="debug-toggle-btn">🐛 Debug: Off</button>
                <button id="sessions-btn">📁 Sessions</button>
                <button id="settings-btn">⚙️ Settings</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Chat Area -->
            <div id="chat-container">
                <!-- Messages will appear here -->
            </div>

            <!-- Debug Sidebar -->
            <div id="debug-sidebar" class="debug-sidebar">
                <div class="debug-header">
                    <h3>🛠️ Debug Info</h3>
                    <button id="close-debug-btn">&times;</button>
                </div>
                <div id="debug-content" class="debug-content">
                    <p class="debug-empty">Waiting for interaction...</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <textarea id="message-input" placeholder="Ketik pesan Anda di sini... (Tekan Enter untuk kirim, Shift+Enter untuk baris baru)"></textarea>
            <button id="send-btn">Kirim</button>
        </div>
    </div>

    <!-- Hidden Audio Element for Playback -->
    <audio id="audio-player" style="display: none;"></audio>

    <!-- Sessions Modal -->
    <div id="sessions-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-sessions-btn">&times;</span>
            <h2>Sessions</h2>
            <button id="new-session-btn" style="margin-bottom: 15px; padding: 10px; background-color: var(--accent-color); color: white; border: none; border-radius: var(--border-radius); cursor: pointer; width: 100%;">Create New Session</button>
            <div id="sessions-list" style="max-height: 300px; overflow-y: auto;">
                <!-- Session items will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Settings</h2>

            <div class="settings-group">
                <h3>General</h3>
                <label>Active Character: <input type="text" id="set-character"></label>
                <label>Memory Extraction Mode:
                    <select id="set-mem-mode">
                        <option value="background">Background</option>
                        <option value="sync">Synchronous</option>
                    </select>
                </label>
                <label>Memory Extraction Interval (Turns): <input type="number" id="set-mem-interval" min="1"></label>
            </div>

            <div class="settings-group">
                <h3>Providers</h3>

                <div class="provider-section">
                    <h4>Chat Provider</h4>
                    <label>Type:
                        <select id="chat-type">
                            <option value="local">Local (LM Studio)</option>
                            <option value="openai">OpenAI API</option>
                            <option value="gemini">Gemini API</option>
                        </select>
                    </label>
                    <label>Base URL: <input type="text" id="chat-url"></label>
                    <label>Model Name: <input type="text" id="chat-model"></label>
                    <label>API Key: <input type="password" id="chat-key"></label>
                </div>

                <div class="provider-section">
                    <h4>Translation Provider</h4>
                    <label>Type:
                        <select id="trans-type">
                            <option value="local">Local (LM Studio)</option>
                            <option value="openai">OpenAI API</option>
                            <option value="gemini">Gemini API</option>
                        </select>
                    </label>
                    <label>Base URL: <input type="text" id="trans-url"></label>
                    <label>Model Name: <input type="text" id="trans-model"></label>
                    <label>API Key: <input type="password" id="trans-key"></label>
                </div>

                <div class="provider-section">
                    <h4>Memory Provider</h4>
                    <label>Type:
                        <select id="mem-type">
                            <option value="local">Local (LM Studio)</option>
                            <option value="openai">OpenAI API</option>
                            <option value="gemini">Gemini API</option>
                        </select>
                    </label>
                    <label>Base URL: <input type="text" id="mem-url"></label>
                    <label>Model Name: <input type="text" id="mem-model"></label>
                    <label>API Key: <input type="password" id="mem-key"></label>
                </div>

                <div class="provider-section">
                    <h4>TTS Provider</h4>
                    <label>Type:
                        <select id="tts-type">
                            <option value="voicevox">VoiceVox</option>
                            <option value="dashscope">Qwen-Bailian (DashScope)</option>
                            <option value="openai_compatible">OpenAI Compatible (MiMo, dll)</option>
                        </select>
                    </label>
                    <div id="tts-voicevox-group">
                        <label>VoiceVox URL: <input type="text" id="tts-voicevox-url"></label>
                    </div>
                    <div id="tts-openai-group">
                        <label>Base URL: <input type="text" id="tts-url"></label>
                        <label>Model Name: <input type="text" id="tts-model"></label>
                        <label>API Key: <input type="password" id="tts-key"></label>
                        <label>Voice Name: <input type="text" id="tts-voice"></label>
                    </div>
                </div>
            </div>

            <button id="save-settings-btn">Save Configurations</button>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
